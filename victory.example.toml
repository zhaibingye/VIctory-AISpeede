# 复制为 victory.toml（不纳入 Git），然后填入自己的路径。
# 游戏、缓存和存档路径必须位于仓库之外。
# 环境变量优先于本文件；VICTORY_CONFIG 可指定其他配置文件。

[paths]
# 你有权运行的游戏目录。环境变量：VICTORY_GAME_DIR
game_dir = 'D:\victory-data\game'

# 默认在游戏 EXE 所在目录的上一级创建 cache。环境变量：VICTORY_CACHE_DIR
# cache_dir = 'D:\victory-data\cache'

# 默认在同一父目录创建 data，单独保存存档等持久数据。环境变量：VICTORY_DATA_DIR
# data_dir = 'D:\victory-data\data'

# PC 版 AMD FidelityFX 目录，包含 amd_fidelityfx_upscaler_dx12.dll。
# 未设置时使用游戏自带版本。环境变量：VICTORY_FIDELITYFX_DIR
# fidelityfx_dir = 'D:\victory-data\fidelityfx'

# 用于检验平台功能的其他 Xbox Series 游戏目录。
# 环境变量：VICTORY_TEST_TITLES（Windows 下用分号分隔）。
test_titles = []
