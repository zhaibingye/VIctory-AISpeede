name: Unified memory fixture

on:
  push:
    branches: [refactor/unified-memory-engine]
    paths:
      - '.github/workflows/unified-memory.yml'
      - 'crates/victory-memory/**'
      - 'crates/victory-hle/Cargo.toml'
      - 'crates/victory-hle/src/modules/xmem.rs'
      - 'crates/victory-hle/src/modules/d3d12x.rs'
      - 'crates/victory-gpu/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warp:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: cargo test -p victory-memory --locked
  xmem:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: 'cargo test -p victory-hle --locked --lib modules::xmem::tests::'
  submission:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: cargo test -p victory-gpu --locked --lib submission_backing_merges_overlapping_and_touching_ranges_only
