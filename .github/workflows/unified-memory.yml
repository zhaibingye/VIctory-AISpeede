name: Unified memory fixture

on:
  push:
    branches: [refactor/unified-memory-engine]
    paths:
      - '.github/workflows/unified-memory.yml'
      - 'crates/victory-memory/**'
      - 'crates/victory-hle/Cargo.toml'
      - 'crates/victory-hle/src/modules/xmem.rs'
      - 'crates/victory-hle/src/modules/d3d12x.rs'
      - 'crates/victory-hle/src/modules/kernel.rs'
      - 'crates/victory-gpu/**'
      - 'crates/victory-shader/**'
      - 'apps/victory/src/translate.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warp:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: cargo test -p victory-memory --locked
  xmem:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: 'cargo test -p victory-hle --locked --lib modules::xmem::tests::'
  submission:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: cargo test -p victory-gpu --locked --lib submission_backing_merges_overlapping_and_touching_ranges_only
      - run: cargo test -p victory-gpu --locked --lib residency_com_charge_stays_until_last_graphics_reference
      - run: cargo test -p victory-gpu --locked --lib addresses_find_the_copy_holding_them
      - run: cargo test -p victory-gpu --locked --lib a_full_table_names_the_largest_copies
      - run: cargo test -p victory-gpu --locked --lib physical_page_delta_preserves_unwritten_cpu_bytes
      - run: cargo test -p victory-gpu --locked --lib captured_page_snapshot_and_merge_use_original_section
      - run: cargo test -p victory-gpu --locked --lib guest_copy_splits_both_ends_and_preserves_physical_aliases
  renderer-page-slabs:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      VICTORY_D3D12_WARP: '1'
    steps:
      - uses: actions/checkout@v5
      - run: cargo test -p victory-gpu --features diagnostics --locked --lib renderer_page_slab_roundtrip_uses_direct_queue_fence
      - run: cargo test -p victory-gpu --features diagnostics --locked --lib paged_direct_queue_merges_only_marked_physical_pages
      - run: cargo test -p victory-gpu --features diagnostics --locked --lib paged_buffer_copy_gathers_overlapping_physical_aliases
      - run: cargo test -p victory-gpu --features diagnostics --locked --lib paged_buffer_copy_batch_orders_alias_dependencies_and_rejects_partial_work
      - run: cargo test -p victory-gpu --features diagnostics --locked --lib paged_title_recording_rejects_mixed_lists_before_alias_copy
      - run: cargo test -p victory-gpu --features diagnostics --locked --lib paged_input_views_gather_cross_page_gpu_writes
  shader-pages:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: cargo test -p victory-shader --features host --locked --lib title_memory_is_read_and_written_
